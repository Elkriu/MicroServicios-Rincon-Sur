spring.application.name=gateway
server.port=8080

# Eureka: dónde está el servidor de registro
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Rutas: la app llama al gateway y este reparte según el comienzo de la ruta.
# lb://nombre = buscar ese servicio en Eureka

# Usuarios y roles
spring.cloud.gateway.server.webflux.routes[0].id=usuario
spring.cloud.gateway.server.webflux.routes[0].uri=lb://usuario
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/usuarios/**,/api/roles/**

# Sesiones y registros
spring.cloud.gateway.server.webflux.routes[1].id=visitante
spring.cloud.gateway.server.webflux.routes[1].uri=lb://visitante
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/sesiones/**,/api/registros/**

# Accesos
spring.cloud.gateway.server.webflux.routes[2].id=administracion
spring.cloud.gateway.server.webflux.routes[2].uri=lb://administracion
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/accesos/**

# Dashboard
spring.cloud.gateway.server.webflux.routes[3].id=dashboard
spring.cloud.gateway.server.webflux.routes[3].uri=lb://dashboard
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/dashboard/**