spring.application.name=usuario
server.port=8081

spring.web.error.include-message=always

spring.datasource.url=jdbc:mysql://localhost:3306/rinconsur_usuarios?createDatabaseIfNotExist=true&serverTimezone=UTC

spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Fotos de perfil
app.fotos.carpeta=uploads/fotos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Recuperación de clave: minutos de vigencia del código de 6 dígitos
app.recuperacion.minutos=10
# true = el código también viaja en la respuesta (solo para pruebas, porque aún no se envía por correo).
# Ponlo en false cuando haya un envío real de correo.
app.recuperacion.devolver-codigo=true
# Eureka: dónde está el servidor de registro
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/